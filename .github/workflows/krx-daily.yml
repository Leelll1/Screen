name: krx-daily

on:
  schedule:
    # ── 수집 시각 (2026-08-29 최초 실측 · 2026-09-05 재확인) ────────────────
    # 거래일 D의 데이터는 D+1 «저녁»에야 공개된다.
    #   실측: D+1 22:00 KST 정상 / D+1 07:21·00:50·00:15 KST 0행
    #   2026-09-05 재확인 — ews_daily.csv 에서 값이 채워진 행의 run_utc 가 전부
    #   13:0x~13:1x UTC(=22:0x KST)였고, 아침 슬롯이 남긴 행은 전부 공란이었다.
    # ⚠️ 2026-08-29 주석의 「append 계열이 키로 덮어쓰므로 슬롯을 여러 개 두어도
    #    무해하다」는 사실이 아니었다 — v3.1 까지 0행 응답이 좋은 행과 원본 JSON 을
    #    덮었다(R-4·R-21). v3.2 부터 0행이면 «쓰지 않는다». 이제 무해하다.
    # 아침·낮 슬롯은 KRX 당일치에는 헛돌지만, 백필(과거 날짜)과 fss 수집은 유효하다.
    - cron: "20 22 * * 1-5"   # 07:20 KST — 백필 슬롯 (당일치는 공개 전)
    - cron: "0 5 * * 1-5"     # 14:00 KST — 백필 슬롯 (당일치 공개 여부 미확정)
    - cron: "0 13 * * 1-5"    # 22:00 KST — 주 수집 (당일치가 실제로 오는 유일한 시각)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # continue-on-error: 여기서 죽어도 커밋 단계까지 가야 한다. 실패 여부는
      # 맨 마지막 「수집 상태 확인」 단계가 판정한다 — 데이터를 잃지 않으면서
      # 실패를 빨간불로 남기기 위한 배치다.
      - name: Fetch KRX data
        id: krx
        continue-on-error: true
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python krx_fetch.py

      # 2026-08-29 신설 — 공공데이터포털(금융위) 계열 수집.
      # 존재 이유: 증시자금추이(위탁매매미수금·반대매매금액·반대매매비중)는
      # 세션의 WebFetch에서 경로 단위로 403이 나 여기서만 받을 수 있다.
      - name: Fetch FSS (public data portal) data
        id: fss
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fss_fetch.py

      # 2026-08-28 교정: 단발 push가 동시 실행과 충돌하면 수집을 다 해놓고
      # 결과를 잃는다(backtest #5 실패 실측). 재시도·리베이스 추가.
      # 2026-09-05 교정: results/_meta/ 를 빠뜨려 source_health.csv 가 매 실행
      # 통째로 버려지고 있었다(R-23). 러너는 매번 새 체크아웃이라 스테이징하지
      # 않은 파일은 잡이 끝나면 사라진다.
      - name: Commit results
        run: |
          mkdir -p results/_meta
          git config user.name "krx-bot"
          git config user.email "actions@github.com"
          git add results/krx/ results/fss/ results/_meta/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "krx+fss $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 5))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1

      # 2026-09-05 신설 (R-22) — 「고장을 고장으로 보이게」.
      # 커밋 «뒤»에 판정하므로 수집 결과는 이미 저장소에 남아 있다.
      # 알람 조건은 krx_fetch.py 가 정한다 — 401·타임아웃·부분응답은 알람이고,
      # 「전 서비스 0행」은 아침 슬롯의 «정상» 상태이므로 알람이 아니다.
      - name: 수집 상태 확인
        if: always()
        run: |
          rc=0
          if [ -f results/krx/run_alarm.txt ]; then
            echo "::error::KRX 수집 알람"
            cat results/krx/run_alarm.txt
            rc=1
          fi
          if [ "${{ steps.krx.outcome }}" != "success" ]; then
            echo "::error::krx_fetch.py 단계가 실패했다 (outcome=${{ steps.krx.outcome }})"
            rc=1
          fi
          if [ "${{ steps.fss.outcome }}" != "success" ]; then
            echo "::warning::fss_fetch.py 단계가 실패했다 (outcome=${{ steps.fss.outcome }}) — KRX 수집은 계속된다"
          fi
          if [ -f results/krx/backfill_state.txt ]; then
            echo "── 백필 상태 ──"; cat results/krx/backfill_state.txt
          fi
          exit $rc
