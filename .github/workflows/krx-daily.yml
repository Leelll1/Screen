name: krx-daily

on:
  schedule:
    # ── 수집 시각 재설계 (2026-08-29 실측 근거) ────────────────────────────
    # KRX Open API는 거래일 D의 일별 데이터를 D+1 영업일 오후에 공개한다.
    #   실측: D+1 22:00 KST 조회 → 정상 / D+1 07:21·00:50·00:15 KST 조회 → 0행
    #   (20개 서비스 전부 응답 OK, rows=0 — 인증·네트워크 문제가 아니다)
    # append_ews()가 basDd를 키로 같은 행을 덮어쓰므로 슬롯을 여러 개 두어도
    # 부작용이 없다. 이른 슬롯이 빈 행을 써도 늦은 슬롯이 채운다.
    - cron: "20 22 * * 1-5"   # 07:20 KST — 조기 시도 (성공 시 당일 아침 회차가 씀)
    - cron: "0 5 * * 1-5"     # 14:00 KST — 주 시도 (공개 직후로 추정되는 시각)
    - cron: "0 13 * * 1-5"    # 22:00 KST — 보증 백필 (유일하게 실증된 시각)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KRX data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python krx_fetch.py
      # 2026-08-28 교정: 단발 push가 동시 실행과 충돌하면 수집을 다 해놓고
      # 결과를 잃는다(backtest #5 실패 실측). 재시도·리베이스 추가.
      - name: Commit results
        run: |
          git config user.name "krx-bot"
          git config user.email "actions@github.com"
          git add results/krx/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "krx $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 5))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1
