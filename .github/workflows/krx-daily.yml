name: krx-daily

on:
  schedule:
    # 월~금 20:20 UTC = 화~토 05:20 KST (예비)
    - cron: "20 20 * * 1-5"
    # 월~금 22:20 UTC = 화~토 07:20 KST (조기경보 08:00 회차 전에 완료)
    - cron: "20 22 * * 1-5"
    # 월~금 13:00 UTC = 당일 22:00 KST — 2026-08-28 현재 유일하게 자료 수집이
    # 실증된 시각. 아침 슬롯이 빈 행을 써도 이 슬롯이 같은 날짜 행을 덮어쓴다.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KRX data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python krx_fetch.py
      # 2026-08-28 교정: 재시도 루프의 조건 연결을 명시적 if로 바꿔
      # pull 실패 시에도 루프가 정상 진행되도록 함
      - name: Commit results
        run: |
          git config user.name "krx-bot"
          git config user.email "actions@github.com"
          git add results/krx/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "krx $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 5))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1

