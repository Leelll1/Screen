name: us-weekly-screen

on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run screen
        run: python screen.py
      - name: Commit results (PIT snapshot)
        run: |
          git config user.name "us-screen-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --cached --quiet || git commit -m "screen $(date -u +%F)"
          git push
