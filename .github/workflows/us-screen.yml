name: us-weekly-screen

on:
  schedule:
    # 매주 금요일 22:00 UTC = 토요일 07:00 KST (토 09:00 미국 발굴 회차 전에 완료)
    - cron: "0 22 * * 5"
  workflow_dispatch: {}   # 수동 실행 버튼 (검증 회차용)

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run screen
        run: python screen.py
      - name: Commit results (PIT snapshot)
        run: |
          git config user.name "us-screen-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --cached --quiet && exit 0
          git commit -m "screen $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep $((i*5))
          done
          git push
