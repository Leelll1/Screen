name: us-weekly-screen

on:
  schedule:
    # 매주 금요일 22:00 UTC = 토요일 07:00 KST (토 09:00 미국 발굴 회차 전에 완료)
    - cron: "0 22 * * 5"
  workflow_dispatch: {}   # 수동 실행 버튼 (검증 회차용)

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      # 2026-09-05: v4/v5 는 Node 20 대상이라 Node 24 로 강제 승격 중이었다.
      # 승격이 끝나면 4개 워크플로가 동시에 깨진다 — 최신 v7 로 올린다.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 2026-09-24 (screen.py v1.2): 스크립트가 차단·실패해도 커밋 단계까지 간다.
      # 실패한 실행은 알람 파일 «하나만» 커밋하고, 맨 끝 「수집 상태 확인」이 빨간불로 끝낸다.
      - name: Run screen
        id: screen
        continue-on-error: true
        run: python screen.py
      - name: Commit results (PIT snapshot)
        run: |
          git config user.name "us-screen-bot"
          git config user.email "actions@github.com"
          if [ "${{ steps.screen.outcome }}" = "success" ]; then
            git add results/
          else
            git add results/_meta/screen_run_alarm.txt || true
          fi
          git diff --cached --quiet && exit 0
          git commit -m "screen $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep $((i*5))
          done
          git push
      - name: 수집 상태 확인
        if: always()
        run: |
          if [ "${{ steps.screen.outcome }}" != "success" ]; then
            echo "::error::screen.py 단계 실패 (outcome=${{ steps.screen.outcome }})"
            if [ -f results/_meta/screen_run_alarm.txt ]; then cat results/_meta/screen_run_alarm.txt; fi
            exit 1
          fi
