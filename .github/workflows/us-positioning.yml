name: us-positioning

# ── 왜 별도 워크플로인가 ────────────────────────────────────────────────
# krx-daily.yml 에 단계를 붙이지 않고 따로 뗐다. 이유 둘.
#   ① 갱신 주기가 다르다 — 한국 자료는 매 거래일, 미국 지반은 주 1회(선물
#      포지션)·월 1회(신용잔고)·일 1회(풋콜)다. 같은 시각에 묶으면 아무것도
#      새로 없는 실행이 대부분이 된다.
#   ② 돌고 있는 것을 건드리지 않는다. 한국 수집은 지금 정상이고, 새 코드가
#      거기서 죽으면 한국 자료까지 멈춘다.
#
# ── 시각 ───────────────────────────────────────────────────────────────
#   · 22:30 UTC 매일 = 07:30 KST — 조기경보 일일 회차(08:00 KST)보다 앞선다.
#   · 20:30 UTC 금요일 — CFTC 선물 포지션 공개(금 15:30 ET = 19:30 UTC, 서머타임 기준)
#     직후를 한 번 더 친다. 서머타임이 끝나면 20:30 ET 기준으로 1시간 밀리므로
#     매일 슬롯이 다음 날 받아 준다.
# ⚠️ 이 시각들은 «추정»이다. 실제로 언제 값이 바뀌는지는 results/_meta/
#    us_source_health.csv 가 몇 주 쌓인 뒤에 확정한다.

on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST — 주 수집
    - cron: "30 20 * * 5"   # 금 CFTC 공개 직후 추가 1회
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: us-positioning
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet openpyxl

      # continue-on-error — 여기서 죽어도 커밋 단계까지 가야 한다.
      # 받은 것을 잃지 않으면서 실패를 빨간불로 남기는 배치다(krx-daily.yml 과 같다).
      - name: Fetch US positioning data
        id: us
        continue-on-error: true
        run: python us_fetch.py

      - name: Commit results
        run: |
          mkdir -p results/us results/_meta
          git config user.name "us-bot"
          git config user.email "actions@github.com"
          git add results/us/ results/_meta/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "us positioning $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 5))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1

      # 커밋 «뒤»에 판정한다 — 수집 결과는 이미 저장소에 남아 있다.
      - name: 수집 상태 확인
        if: always()
        run: |
          rc=0
          if [ -f results/us/run_alarm.txt ]; then
            echo "::error::미국 지반 수집 알람"
            cat results/us/run_alarm.txt
            rc=1
          fi
          if [ "${{ steps.us.outcome }}" != "success" ]; then
            echo "::error::us_fetch.py 단계가 실패했다 (outcome=${{ steps.us.outcome }})"
            rc=1
          fi
          echo "── 최근 소스 상태 ──"
          tail -n 12 results/_meta/us_source_health.csv || true
          exit $rc
